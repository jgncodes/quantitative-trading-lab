[project]
name = "quantitative-trading-lab"
version = "0.1.0"
description = "A quantitative finance research laboratory for developing, testing, and evaluating algorithmic trading strategies."
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "projects"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
    "integration: tests involving multiple internal components",
    "slow: tests that require additional execution time",
]

[tool.coverage.run]
source = ["quantlab"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["src"]
